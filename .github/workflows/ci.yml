name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + typecheck + tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check backend

      - name: MyPy type check
        run: uv run mypy backend
        continue-on-error: true  # tighten once stubs are gone

      - name: Pytest
        run: |
          uv run pytest backend/tests/ \
            -m "not integration and not live_api and not slow" \
            --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Backend Docker build smoke
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ffa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + lint + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # Compose smoke: bring up Postgres + Qdrant, schema applies, tickers seeded
  # ---------------------------------------------------------------------------
  compose-smoke:
    name: docker compose smoke (postgres, qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Start postgres + qdrant
        run: |
          docker compose up -d postgres qdrant
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' ffa-postgres 2>/dev/null | grep -q healthy; then
              echo "postgres healthy"
              break
            fi
            echo "waiting for postgres ($i)..."
            sleep 2
          done

      - name: Verify schema applied (20 tickers seeded)
        run: |
          count=$(docker exec ffa-postgres psql -U ffa -d filings -tAc "SELECT COUNT(*) FROM companies;")
          if [ "$count" != "20" ]; then
            echo "Expected 20 tickers, got $count"
            exit 1
          fi
          echo "20 tickers verified"

      - name: Verify Qdrant readyz
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "qdrant ready"
              break
            fi
            sleep 2
          done

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Eval subset on PRs. Activates once a real Groq key is in repo secrets.
  # Until then, this job runs and verifies the eval harness imports cleanly.
  # ---------------------------------------------------------------------------
  eval-subset:
    name: Eval (30Q dev subset)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --all-extras

      - name: Verify eval harness imports
        run: |
          uv run python -c "
          from backend.eval.runner import ABLATION_CONFIGS
          from backend.eval.metrics import aggregate_results, render_ablation_table
          from backend.eval.llm_judge import cohens_kappa
          print(f'ablation configs available: {len(ABLATION_CONFIGS)}')
          for c in ABLATION_CONFIGS:
              print(f'  - {c.name}')
          "

      - name: Run dev-set eval (when GROQ_API_KEY secret is set)
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          # Deferred until ingested data is available in CI.
          # When wired: uv run python -m backend.eval.run_eval --suite dev --gap-ms 2000
          echo "Eval-on-PR placeholder. Real run gated on CI ingestion fixture."
