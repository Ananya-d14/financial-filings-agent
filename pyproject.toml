[project]
name = "financial-filings-agent"
version = "0.1.0"
description = "Agentic RAG over SEC filings (10-K, 10-Q, 8-K) with grounded citations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ananya Joshi", email = "joshi.ananya.joshi@gmail.com" }]

dependencies = [
    # --- API / runtime ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anyio>=4.6",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    # --- Logging / observability ---
    "structlog>=24.4",
    "rich>=13.9",
    "langfuse>=2.50,<3.0",  # 2.x stable; bump after Phase 4 if v3 features needed
    # --- DB / storage ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "qdrant-client>=1.12",
    # --- LLM clients ---
    # Primary: Groq (free tier, Llama 3.3 70B). Fallback: local Ollama on host.
    "groq>=0.13",
    "ollama>=0.4",
    # --- Orchestration ---
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
    # --- Ingestion / parsing ---
    "edgartools>=3.0",
    "unstructured[md]>=0.16",
    # Docling pinned looser; will narrow once we choose between unstructured/Docling for HTML tables
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # --- Embeddings / reranker (local) ---
    "sentence-transformers>=3.3",
    "torch>=2.5",
    # --- Eval ---
    "ragas>=0.2",
    "datasets>=3.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "mutmut>=2.5",  # mutation testing on calculator
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["notebooks/", "frontend/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    "edgartools.*",
    "unstructured.*",
    "sentence_transformers.*",
    "qdrant_client.*",
    "ragas.*",
    "groq.*",
    "langgraph.*",
]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: tests that require running infra (db, qdrant)",
    "slow: tests >1s",
    "live_api: tests that hit external APIs (gated)",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/eval/runs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 50  # raised to 100 for calculator + citation_verifier modules in CI

# --- uv ---
[tool.uv]
package = true
